<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>투자 분석</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#152033;--muted:#667085;--line:#e6eaf0;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}header{background:#101828;color:#fff;padding:24px 28px}h1{margin:0}.topnav{display:flex;gap:8px;margin-top:14px}.topnav a{color:#fff;text-decoration:none;border:1px solid #475467;border-radius:999px;padding:7px 13px;font-size:13px}.topnav a.active{background:#fff;color:#101828;border-color:#fff}.wrap{max-width:1280px;margin:auto;padding:22px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}.label{font-size:13px;color:var(--muted)}.value{font-size:24px;font-weight:750;margin-top:7px}.barrow{display:grid;grid-template-columns:110px 1fr 120px;gap:10px;align-items:center;margin:10px 0}.bar{height:14px;background:#eef2f6;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}.num{text-align:right}.auth-overlay{position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;align-items:center;justify-content:center}.auth-box{width:min(420px,90%);background:#fff;padding:26px;border-radius:16px;border:1px solid var(--line)}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:12px 0}.primary{width:100%;border:0;background:var(--accent);color:#fff;padding:11px;border-radius:9px;font-weight:700}.err{color:#b42318;font-size:13px;margin-top:8px}.hidden{display:none}.tablebox{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}th{text-align:left;background:#f8fafc}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.cards{grid-template-columns:1fr}.barrow{grid-template-columns:90px 1fr 90px}.wrap{padding:14px}}</style></head><body>
<div id="auth" class="auth-overlay"><div class="auth-box"><h2>투자 분석 로그인</h2><div class="label">투자관리와 같은 비밀번호를 사용합니다.</div><input id="pw" type="password" placeholder="비밀번호"><button class="primary" onclick="login()">로그인</button><div id="err" class="err"></div></div></div>
<header><h1>투자 분석</h1><nav class="topnav"><a href="/">투자관리</a><a class="active" href="/analysis.html">분석</a></nav></header><main class="wrap">
<div class="card"><h2>월별 배당금</h2><div id="monthly"></div></div>
</main><script>
const fmt=n=>new Intl.NumberFormat('ko-KR',{maximumFractionDigits:0}).format(Math.round(Number(n)||0));
async function login(){const p=document.getElementById('pw').value;const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});if(!r.ok){document.getElementById('err').textContent='비밀번호를 확인해 주세요.';return}load()}
async function load(){const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)return;document.getElementById('auth').classList.add('hidden');const s=await r.json(),divs=s.dividends||[];const names=['연금저축','연금저축2','irp','퇴직연금'];const dv=divs.filter(d=>names.includes(d.account));const dval=d=>(Number(d.amount)||((Number(d.unit)||0)*(Number(d.qty)||0)));const mon={};for(const d of dv){const k=String(d.payDate||'').slice(0,7);if(k)mon[k]=(mon[k]||0)+dval(d)}bars('monthly',Object.entries(mon).sort((a,b)=>a[0].localeCompare(b[0])))}
function bars(id,arr){if(!arr.length){document.getElementById(id).innerHTML='<div class="label">표시할 데이터가 없습니다.</div>';return}const m=Math.max(...arr.map(x=>x[1]),1);document.getElementById(id).innerHTML=arr.map(([k,v])=>'<div class="barrow"><div>'+k+'</div><div class="bar"><i style="width:'+Math.max(1,v/m*100)+'%"></i></div><div class="num">'+fmt(v)+'원</div></div>').join('')}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});load();
</script></body></html>
